# Builds the CrapSniffer installers on GitHub's own machines - no Mac needed.
#   macOS: CrapSniffer-<version>-macOS-arm64.dmg (Apple Silicon) and -x86_64.dmg (Intel)
#   Windows: CrapSniffer-<version>-Windows.exe
# Each build self-tests the packaged app on real audio before uploading it.
#
# - Push a tag like v1.2.0: builds everything and publishes a GitHub Release with the
#   installers attached (the Releases page keeps them permanently).
# - "Run workflow" on the Actions tab: builds only; download from the run's "Artifacts"
#   (kept for 90 days).

name: Build installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number shown in the app
        default: "1.0.0"
  push:
    tags: ["v*"]

env:
  VERSION_INPUT: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15         # Apple Silicon (arm64)
          - runner: macos-15-intel   # Intel (x86_64)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Build, self-test and package
        run: |
          export CRAPSNIFFER_VERSION="${VERSION_INPUT#v}"
          bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: CrapSniffer-macOS-${{ runner.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Build
        run: |
          uv sync --python 3.14 --frozen
          uv run --no-sync pyinstaller packaging/crapsniffer.spec --noconfirm
      - name: Self-test the packaged exe
        shell: pwsh
        run: |
          uv run --no-sync python tools/make_test_files.py build/selftest | Out-Null
          $files = "build/selftest/clean_16bit.wav", "build/selftest/mp3_128.wav", "build/selftest/_tmp/aac_128.m4a"
          Start-Process dist/CrapSniffer.exe -ArgumentList (@("--self-test", "build/selftest.json") + $files) -Wait
          $r = Get-Content build/selftest.json -Raw | ConvertFrom-Json
          $r.files | Format-Table file, quality, status, grid, error
          if (-not $r.frozen -or ($r.files | Where-Object { $_.error })) { exit 1 }
      - name: Name the exe after its version
        shell: bash
        run: mv dist/CrapSniffer.exe "dist/CrapSniffer-${VERSION_INPUT#v}-Windows.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: CrapSniffer-Windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    # Only for version tags. Runs even if one build failed (e.g. GitHub retires its Intel Macs),
    # publishing whatever installers were built; a failed build still shows red on the run.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la installers
          if [ -z "$(ls installers)" ]; then echo "No installers were built"; exit 1; fi
          cat > notes.md <<'EOF'
          ## Which file do I download?

          | Your computer | File |
          |---|---|
          | Mac with Apple Silicon (M1, M2, M3, M4) - macOS 14+ | `CrapSniffer-…-macOS-arm64.dmg` |
          | Mac with an Intel processor - macOS 12+ | `CrapSniffer-…-macOS-x86_64.dmg` |
          | Windows 10 / 11 (64-bit) | `CrapSniffer-…-Windows.exe` |

          Not sure which Mac you have? Apple menu → **About This Mac**: "Chip: Apple M…" means Apple Silicon, "Processor: Intel…" means Intel.

          ## Installing

          **Mac:** open the .dmg and drag **CrapSniffer** onto **Applications**. The first launch is blocked because the app isn't signed with a paid Apple Developer ID. On macOS 15 or newer: try to open it, click **Done**, then go to **System Settings → Privacy & Security** and click **Open Anyway**. On macOS 14: right-click the app → **Open** → **Open**.

          **Windows:** just double-click the .exe; nothing to install. If "Windows protected your PC" appears, click **More info → Run anyway**. The main window takes about 10 seconds to appear after the splash screen.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" installers/* --clobber
          else
            gh release create "$TAG" installers/* --title "CrapSniffer ${TAG#v}" --notes-file notes.md
          fi
